<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotify Stream Manager</title>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/setup.css" />
  </head>
  <body>
    <!-- Pro Console Header -->
    <header>
      <div class="nav-container">
        <div class="nav-left">
          <a href="/setup" class="nav-brand">
            <div class="brand-icon">
              <i class="fa-solid fa-compact-disc"></i>
            </div>
            <span class="brand-title">Spotify Stream Manager</span>
          </a>
        </div>

        <nav class="nav-center">
          <a href="/setup" class="nav-pill active">
            <i class="fa-solid fa-sliders"></i>
            <span>Setup</span>
          </a>
          <a href="/check" class="nav-pill">
            <i class="fa-solid fa-heart-pulse"></i>
            <span>Diagnostics</span>
          </a>
          <a href="/" target="_blank" class="nav-pill">
            <i class="fa-solid fa-layer-group"></i>
            <span>Live Overlay</span>
          </a>
        </nav>

        <div class="nav-right">
          <div class="quick-status-indicators">
            <div class="quick-status-item" title="Twitch Connection Status">
              <span id="quick-dot-twitch" class="status-dot"></span>
              <span>Twitch</span>
            </div>
            <div class="quick-status-item" title="Spotify Connection Status">
              <span id="quick-dot-spotify" class="status-dot"></span>
              <span>Spotify</span>
            </div>
          </div>
          <button id="save" class="header-save-btn">
            <span class="save-dot"></span>
            <span id="save-btn-text">Save Changes</span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <!-- Global Notification Banner -->
      <div id="message" role="alert"></div>

      <div class="setup-container">
        <!-- ROW 1: INTEGRATIONS (Side-by-side Twitch & Spotify) -->
        <div class="integrations-row">
          <!-- Twitch Bot Card -->
          <section class="card">
            <div class="card-header">
              <div class="card-title-group">
                <div class="service-icon twitch">
                  <i class="fa-brands fa-twitch"></i>
                </div>
                <h2 class="card-title">Twitch Bot</h2>
              </div>
              <span id="twitch-status" class="status-badge">Not connected</span>
            </div>

            <div class="grid-2">
              <div class="field">
                <label for="twitch-client-id">Twitch Client ID</label>
                <div class="input-wrapper">
                  <input id="twitch-client-id" type="password" placeholder="Application Client ID" autocomplete="off" spellcheck="false" />
                  <button type="button" class="field-btn" data-toggle="twitch-client-id" title="Toggle visibility">
                    <i class="fa-solid fa-eye"></i>
                  </button>
                </div>
              </div>

              <div class="field">
                <label for="twitch-channel">Target Streamer Channel</label>
                <input id="twitch-channel" type="text" placeholder="channel_name (no @)" autocomplete="off" spellcheck="false" />
              </div>
            </div>

            <div class="btn-group">
              <button id="twitch-connect" class="btn-primary">
                <i class="fa-solid fa-bolt"></i>
                Authorize Bot
              </button>
              <button id="twitch-disconnect" class="btn-secondary">Disconnect</button>
            </div>

            <p id="twitch-device"></p>
          </section>

          <!-- Spotify Integration Card -->
          <section class="card">
            <div class="card-header">
              <div class="card-title-group">
                <div class="service-icon spotify">
                  <i class="fa-brands fa-spotify"></i>
                </div>
                <h2 class="card-title">Spotify API</h2>
              </div>
              <span id="spotify-status" class="status-badge">Not connected</span>
            </div>

            <div class="grid-2">
              <div class="field">
                <label for="spotify-client-id">Spotify Client ID</label>
                <div class="input-wrapper">
                  <input id="spotify-client-id" type="password" placeholder="Application Client ID" autocomplete="off" spellcheck="false" />
                  <button type="button" class="field-btn" data-toggle="spotify-client-id" title="Toggle visibility">
                    <i class="fa-solid fa-eye"></i>
                  </button>
                </div>
              </div>

              <div class="field">
                <label>Redirect URI</label>
                <div class="copy-box">
                  <code id="redirect-uri"></code>
                  <button type="button" id="copy-redirect" class="copy-btn" title="Copy to clipboard">
                    <i class="fa-solid fa-copy"></i>
                    Copy
                  </button>
                </div>
              </div>
            </div>

            <div class="btn-group">
              <button id="spotify-connect" class="btn-primary">
                <i class="fa-solid fa-bolt"></i>
                Authorize Spotify
              </button>
              <button id="spotify-disconnect" class="btn-secondary">Disconnect</button>
            </div>
          </section>
        </div>

        <!-- ROW 2: BOT BEHAVIOR & MESSAGES (Side-by-side) -->
        <div class="behavior-row">
          <!-- Left: Commands & Rules -->
          <section class="card">
            <div class="card-header">
              <div class="card-title-group">
                <div class="service-icon chat">
                  <i class="fa-solid fa-gear"></i>
                </div>
                <h2 class="card-title">Rules &amp; Cooldowns</h2>
              </div>
            </div>

            <div class="switches-grid">
              <div class="switch-row">
                <label for="chat-enabled" class="switch-label">
                  <span class="switch-title">Chat Commands</span>
                  <span class="switch-desc">Respond in chat</span>
                </label>
                <label class="switch">
                  <input id="chat-enabled" type="checkbox" />
                  <span class="slider"></span>
                </label>
              </div>

              <div class="switch-row">
                <label for="requests-enabled" class="switch-label">
                  <span class="switch-title">Song Requests</span>
                  <span class="switch-desc">Queue to Spotify</span>
                </label>
                <label class="switch">
                  <input id="requests-enabled" type="checkbox" />
                  <span class="slider"></span>
                </label>
              </div>
            </div>

            <div class="grid-2">
              <div class="field">
                <label for="current-song-commands">Now-Playing Aliases</label>
                <input id="current-song-commands" type="text" placeholder="!song, !np, !music" />
              </div>
              <div class="field">
                <label for="request-commands">Request Aliases</label>
                <input id="request-commands" type="text" placeholder="!sr, !request" />
              </div>
            </div>

            <div class="grid-2">
              <div class="field">
                <label for="request-role">Minimum Request Role</label>
                <select id="request-role">
                  <option value="everyone">Everyone</option>
                  <option value="subscriber">Subscriber &amp; Above</option>
                  <option value="vip">VIP &amp; Above</option>
                  <option value="moderator">Moderator &amp; Above</option>
                  <option value="broadcaster">Broadcaster Only</option>
                </select>
              </div>

              <div class="grid-2">
                <div class="field">
                  <label for="user-cooldown">User (s)</label>
                  <input id="user-cooldown" type="number" min="0" max="86400" />
                </div>
                <div class="field">
                  <label for="global-cooldown">Global (s)</label>
                  <input id="global-cooldown" type="number" min="0" max="86400" />
                </div>
              </div>
            </div>
          </section>

          <!-- Right: Single-Input Message Template Manager & Live Preview -->
          <section class="card">
            <div class="card-header">
              <div class="card-title-group">
                <div class="service-icon chat">
                  <i class="fa-solid fa-comments"></i>
                </div>
                <h2 class="card-title">Message Templates</h2>
              </div>
              <span class="helper-text" style="font-size: 10.5px; color: var(--text-muted);">Blank = silenced</span>
            </div>

            <div class="template-selector-wrapper">
              <label for="template-selector">Select Event Template</label>
              <select id="template-selector">
                <optgroup label="Playback Status">
                  <option value="now_playing" data-tokens="{track},{artist},{user}">Now Playing Track</option>
                  <option value="paused">Paused Track</option>
                  <option value="nothing_playing">Nothing Playing</option>
                </optgroup>
                <optgroup label="Requests &amp; Queue">
                  <option value="queued" data-tokens="{track},{user}">Song Queued Successfully</option>
                  <option value="usage" data-tokens="{command}">Command Usage Helper</option>
                  <option value="no_match">No Matching Track Found</option>
                  <option value="request_error">Generic Request Error</option>
                </optgroup>
                <optgroup label="Permissions &amp; Limits">
                  <option value="permission_denied">Permission Denied (Role)</option>
                  <option value="cooldown" data-tokens="{seconds},{user}">Cooldown Active</option>
                  <option value="rate_limited">Rate Limit Exceeded</option>
                </optgroup>
                <optgroup label="Errors &amp; Spotify API">
                  <option value="no_device">No Active Playback Device</option>
                  <option value="spotify_not_connected">Spotify Not Connected</option>
                  <option value="spotify_auth_expired">Authorization Expired</option>
                  <option value="spotify_denied">Spotify Request Denied</option>
                  <option value="quota_exceeded">Spotify Quota Exhausted</option>
                </optgroup>
              </select>
            </div>

            <div class="field">
              <label for="active-template-input">Template Response Text</label>
              <input id="active-template-input" type="text" placeholder="Enter bot response message (or leave empty to silence)" autocomplete="off" spellcheck="false" />
              <div id="active-tag-pills" class="tag-pills"></div>
            </div>

            <!-- Integrated Live Twitch Chat Preview -->
            <div class="chat-preview-box">
              <div class="chat-preview-label">
                <i class="fa-brands fa-twitch"></i>
                <span>Live Chat Preview</span>
              </div>
              <div class="chat-message-bubble">
                <span class="chat-bot-badge">BOT</span>
                <span id="preview-bot-name" class="chat-bot-user">OverlayBot:</span>
                <span id="preview-bot-text" class="chat-message-text">Now playing: Starboy by The Weeknd</span>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="/setup.js"></script>
  </body>
</html>
