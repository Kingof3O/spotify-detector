<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotify Overlay Health Check</title>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/check.css" />
  </head>
  <body>
    <!-- Pro Console Header -->
    <header>
      <div class="nav-container">
        <div class="nav-left">
          <a href="/check" class="nav-brand">
            <div class="brand-icon">
              <i class="fa-solid fa-compact-disc"></i>
            </div>
            <span class="brand-title">Spotify Overlay</span>
          </a>
        </div>

        <nav class="nav-center">
          <a href="/setup" class="nav-pill">
            <i class="fa-solid fa-sliders"></i>
            <span>Setup</span>
          </a>
          <a href="/check" class="nav-pill active">
            <i class="fa-solid fa-heart-pulse"></i>
            <span>Diagnostics</span>
          </a>
          <a href="/" target="_blank" class="nav-pill">
            <i class="fa-solid fa-layer-group"></i>
            <span>Live Overlay</span>
          </a>
        </nav>

        <div class="nav-right">
          <button id="refresh" class="header-save-btn">
            <i id="refresh-icon" class="fa-solid fa-rotate"></i>
            <span>Run Live Check</span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <!-- Quick Metrics Grid (Full width across top) -->
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-top">
            <div class="metric-icon">
              <i class="fa-solid fa-server"></i>
            </div>
            <span id="metric-dot-server" class="metric-dot ok"></span>
          </div>
          <span class="metric-label">Local Server</span>
          <span id="metric-val-server" class="metric-value">Active</span>
        </div>

        <div class="metric-card">
          <div class="metric-top">
            <div class="metric-icon">
              <i class="fa-solid fa-music"></i>
            </div>
            <span id="metric-dot-media" class="metric-dot ok"></span>
          </div>
          <span class="metric-label">Media Session</span>
          <span id="metric-val-media" class="metric-value">Detecting…</span>
        </div>

        <div class="metric-card">
          <div class="metric-top">
            <div class="metric-icon">
              <i class="fa-brands fa-twitch"></i>
            </div>
            <span id="metric-dot-twitch" class="metric-dot ok"></span>
          </div>
          <span class="metric-label">Twitch Bot</span>
          <span id="metric-val-twitch" class="metric-value">Checking…</span>
        </div>

        <div class="metric-card">
          <div class="metric-top">
            <div class="metric-icon">
              <i class="fa-brands fa-spotify"></i>
            </div>
            <span id="metric-dot-spotify" class="metric-dot ok"></span>
          </div>
          <span class="metric-label">Spotify API</span>
          <span id="metric-val-spotify" class="metric-value">Checking…</span>
        </div>
      </div>

      <!-- 2-Column Diagnostics Dashboard -->
      <div class="check-dashboard">
        <!-- Left: Status Overview & Controls -->
        <div class="check-col-left">
          <section class="status-overview-card">
            <div class="status-hero-pulse">
              <div id="hero-pulse" class="status-pulse-ring ok">
                <i class="fa-solid fa-heart-pulse"></i>
              </div>
              <div class="status-hero-text">
                <h1 id="hero-title">System Status</h1>
                <p id="summary">Running live diagnostics…</p>
              </div>
            </div>

            <div class="status-actions">
              <span id="updated">Checking…</span>
              <a href="/setup" class="btn-secondary" style="justify-content: center; padding: 9px 14px;">
                <i class="fa-solid fa-sliders"></i>
                Open Setup Dashboard
              </a>
              <a href="/" target="_blank" class="btn-secondary" style="justify-content: center; padding: 9px 14px;">
                <i class="fa-solid fa-layer-group"></i>
                Open Live OBS Overlay
              </a>
            </div>
          </section>
        </div>

        <!-- Right: Diagnostic Checklist Cards Stack -->
        <div class="check-col-right">
          <section class="card" style="padding: 16px 18px;">
            <div class="card-header">
              <div class="card-title-group">
                <div class="service-icon chat">
                  <i class="fa-solid fa-list-check"></i>
                </div>
                <h2 class="card-title">Detailed Diagnostic Checks</h2>
              </div>
            </div>
            <div id="checks"></div>
          </section>
        </div>
      </div>
    </main>

    <script src="/check.js"></script>
  </body>
</html>
