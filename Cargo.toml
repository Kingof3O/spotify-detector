[package]
name = "spotify-overlay"
version = "0.1.2"
edition = "2021"
rust-version = "1.82"
description = "A low-resource, local Spotify now-playing overlay for OBS"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.7.9", features = ["ws"] }
futures-util = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "1.0.69"
tokio = { version = "1.44.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_Com",
] }
windows-future = "0.3.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "warn"
