name: Release Windows x64

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Run tests
        shell: bash
        run: cargo test --all-targets

      - name: Build optimized executable
        shell: bash
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package release
        shell: pwsh
        run: |
          $stage = "dist"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\spotify-overlay.exe" "$stage\spotify-overlay.exe"
          Copy-Item "README.md" "$stage\README.md"
          Compress-Archive -Path "$stage\*" -DestinationPath "spotify-overlay-windows-x64.zip" -Force

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "spotify-overlay ${{ github.ref_name }}" --generate-notes "spotify-overlay-windows-x64.zip"
