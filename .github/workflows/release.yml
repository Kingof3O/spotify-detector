name: Release Windows x64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git ref to build (tag, branch, or commit)"
        required: false
        default: ""
      release_tag:
        description: "Release tag to publish"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Run tests
        shell: bash
        run: cargo test --all-targets

      - name: Build optimized executable
        shell: bash
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package release
        shell: pwsh
        run: |
          $stage = "dist"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\spotify-overlay.exe" "$stage\spotify-overlay.exe"
          Copy-Item "scripts\restart-and-check.cmd" "$stage\restart-and-check.cmd"
          Copy-Item "README.md" "$stage\README.md"
          Compress-Archive -Path "$stage\*" -DestinationPath "spotify-overlay-windows-x64.zip" -Force

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" --title "spotify-overlay $RELEASE_TAG" --generate-notes "spotify-overlay-windows-x64.zip"
